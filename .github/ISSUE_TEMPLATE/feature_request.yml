name: Feature request
description: Suggest a capability or an improvement
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Product constraints
      options:
        - label: The proposal does not require PowerShell, RSAT or the ActiveDirectory module.
          required: true
        - label: The proposal keeps AD transport encrypted (LDAPS or StartTLS).
          required: true
