name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Policy (no PowerShell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan sources and packaging for a PowerShell or shell-plugin layer
        run: |
          set -eu
          # The product promise is a native client. This guard fails before the
          # build if powershell.exe, LAPS cmdlets, -EncodedCommand, the Tauri
          # shell plugin or a shell-allow capability reappear anywhere that can
          # execute code, including the NSIS hooks and the Tauri capabilities.
          if grep -RIniE \
              'powershell\.exe|get-lapsadpassword|encodedcommand|tauri-plugin-shell|shell:allow-execute|shell:allow-open|command::new\("powershell"' \
              src src-tauri/src src-tauri/Cargo.toml src-tauri/tauri.conf.json \
              src-tauri/capabilities src-tauri/installer package.json; then
            echo "::error::PowerShell or shell-plugin usage detected"
            exit 1
          fi

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  backend-linux:
    name: Rust backend (Linux)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # tauri::generate_context! embeds ../dist, so the frontend must exist
      # before the crate is compiled.
      - run: npm ci
      - run: npm run build
      - name: Install Tauri system dependencies
        timeout-minutes: 30
        run: |
          updated=0
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20; then
              updated=1
              break
            fi
            echo "apt-get update attempt ${attempt} failed"
            sleep 5
          done
          [ "$updated" = 1 ] || exit 1
          installed=0
          for attempt in 1 2; do
            if sudo timeout 600 apt-get install -y --no-install-recommends \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Options::=--force-confold \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libssl-dev libkeyutils-dev pkg-config build-essential; then
              installed=1
              break
            fi
            echo "apt-get install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 5
          done
          [ "$installed" = 1 ] || exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  backend-windows:
    name: Rust backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build the NSIS installer
        run: npm run tauri build
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kmaruda-laps-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  rust-audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
